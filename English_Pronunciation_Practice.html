        .sidebar {

            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;

            z-index: 10;
            transition: all 0.3s ease;
        }

        .sidebar h2 {
            color: #1e293b;
            font-size: 1.35rem;
            margin-bottom: 8px;
            text-align: center;
            font-weight: 800;
            line-height: 1.3;
        }

        .active-sound-box {
            color: #4f46e5;
            font-size: 1.7rem;
            display: block;
            margin-top: 4px;
        }

        .unit-select-container {
            margin-bottom: 12px;
            padding-bottom: 14px;
            border-bottom: 2px dashed #cbd5e1;
        }

        .unit-select-label {
            font-size: 0.8rem;
            font-weight: 800;
            color: #64748b;
            text-transform: uppercase;
            display: block;
            margin-bottom: 6px;
        }

        .unit-select-box {
            width: 100%;
            padding: 10px 12px;
            border-radius: 12px;
            background: #f8fafc;
            border: 2px solid #cbd5e1;
            font-size: 0.95rem;
            font-weight: 800;
            color: #1e293b;
            cursor: pointer;
            outline: none;
            transition: all 0.2s;
        }

        .unit-select-box:hover, .unit-select-box:focus {
            border-color: #4f46e5;
            background: #ffffff;
        }

        .menu-btn {
            padding: 14px 18px;
            border-radius: 12px;
            background: #f8fafc;
            color: #475569;
            border: 2px solid transparent;
            cursor: pointer;
            text-align: left;
            font-size: 1.05rem;
            font-weight: 800;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .menu-btn:hover {
            background: #f1f5f9;
            transform: translateX(4px);
            border-color: #cbd5e1;
        }

        .menu-btn.active {
            background: #4f46e5;
            color: white;
            border-color: #4338ca;
            box-shadow: 0 4px 10px rgba(79, 70, 229, 0.3);
            transform: translateX(4px);
        }

        .version-info {
            margin-top: auto;
            text-align: center;
            font-size: 0.85rem;
            color: #94a3b8;
            font-weight: bold;
            line-height: 1.4;
        }

        /* --- MAIN IFRAME CONTAINER --- */
        .main-view {
            flex: 1;
            padding: 15px;
            display: flex;
            flex-direction: column;
            background: #e2e8f0;
        }

        iframe {
            flex: 1;
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 20px;
            background: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            transition: opacity 0.3s ease;
        }

        /* --- RESPONSIVE MOBILE --- */
        @media (max-width: 860px) {
            body { flex-direction: column; }
            .sidebar {
                width: 100%;
                padding: 10px;
                flex-direction: row;
                overflow-x: auto;
                white-space: nowrap;
                height: auto;
                box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            }
            .sidebar h2, .version-info, .unit-select-container { display: none; }
            .menu-btn { flex: 0 0 auto; padding: 10px 14px; font-size: 0.95rem; }
            .main-view { padding: 8px; }
            iframe { border-radius: 12px; }
        }

        .sidebar-nav { display: flex; flex-direction: column; gap: 12px; }
        @media (max-width: 860px) {

            body { height: 100vh; height: 100dvh; min-height: 100svh; overflow: hidden; flex-direction: column; }

            .sidebar h2, .version-info { display: none; }
            .unit-select-container { display: block; margin: 0; padding: 0; border: 0; }

</head>

        :root {

            .tip-box { width: 100%; padding: 7px 10px; font-size: .78rem; line-height: 1.4; text-align: center; }
            .stage { flex: 1 1 auto; min-height: 0; padding: 10px; align-items: stretch; justify-content: flex-start; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
            .slide { width: 100%; margin: 0 auto; padding: 18px 14px; border-radius: 14px; }

            .slide-title { font-size: 1.55rem; line-height: 1.25; }

            .word-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }

            .p-arrow { font-size: 1.15rem; }
            .summary-container { flex-direction: column; gap: 12px; }
            .summary-box { padding: 16px; border-radius: 15px; }
            .sum-title { margin-bottom: 10px; font-size: 1.8rem; }
            .sum-patterns { gap: 7px; margin-bottom: 12px; }
            .pattern-tag { padding: 7px 11px; font-size: .98rem; }
            .sum-tip { padding: 13px; font-size: .95rem; line-height: 1.5; }
            .congrats { font-size: 1.35rem; }
            .controls { flex: 0 0 auto; display: grid; grid-template-columns: auto minmax(34px, 1fr) auto; gap: 7px; padding: 8px 9px; }
            .btn { min-height: 44px; padding: 9px 10px; font-size: .86rem; white-space: nowrap; }
            .progress-dots { max-width: 100%; max-height: 38px; min-width: 0; gap: 5px; overflow: auto; }
            .dot { width: 8px; height: 8px; flex: 0 0 8px; }
            .pronunciation-video-tools { width: 100%; margin: 10px 0 14px; padding: 10px; }
            .pronunciation-video-buttons { gap: 7px; }
            .pronunciation-video-button { min-height: 44px; padding: 8px 11px; }
            .pronunciation-video-panel { width: 100%; max-width: 100%; }
            .pronunciation-video-player { max-height: 38vh; }
            .dict-overlay { padding: 14px; }
            .dict-box { width: min(100%, 360px); max-height: 86dvh; overflow-y: auto; padding: 20px; }
        }
        @media (max-width: 380px) {
            .word-grid { grid-template-columns: 1fr; }
            .header h1 { font-size: 1.02rem; }
            .tip-box { font-size: .72rem; }
            .btn { padding-right: 8px; padding-left: 8px; font-size: .8rem; }
        }
    &lt;/style&gt;
&lt;/head&gt;
&lt;body oncontextmenu="return false;"&gt;

    &lt;div class="header"&gt;
        &lt;h1&gt;🎙️ Pronunciation Step-by-Step: __UNIT_TITLE__&lt;/h1&gt;
        &lt;div class="tip-box"&gt;🖱️ Click TRÁI: Nghe &amp; Dịch nhanh | Click PHẢI: Mở Từ điển chi tiết&lt;/div&gt;
    &lt;/div&gt;

    &lt;div class="stage" id="stage"&gt;&lt;/div&gt;

    &lt;div class="controls"&gt;
        &lt;button class="btn btn-prev" id="btn-prev" onclick="prevSlide()"&gt;← Quay lại&lt;/button&gt;
        &lt;div class="progress-dots" id="dots-container"&gt;&lt;/div&gt;
        &lt;button class="btn btn-next" id="btn-next" onclick="nextSlide()"&gt;Tiếp tục →&lt;/button&gt;
    &lt;/div&gt;

    &lt;div class="dict-overlay" id="dict-popup" onclick="closeDict(event)"&gt;
        &lt;div class="dict-box" onclick="event.stopPropagation()"&gt;
            &lt;div class="dict-word" id="d-word"&gt;Word&lt;/div&gt;
            &lt;div class="dict-ipa" id="d-ipa"&gt;/ipa/&lt;/div&gt;
            &lt;div class="dict-pos" id="d-pos"&gt;noun&lt;/div&gt;
            &lt;div class="dict-vi" id="d-vi"&gt;Nghĩa tiếng việt&lt;/div&gt;
            &lt;br&gt;
            &lt;button class="btn-close" onclick="closeDict()"&gt;Đóng&lt;/button&gt;
        &lt;/div&gt;
    &lt;/div&gt;

    &lt;div id="tooltip"&gt;Dịch: ...&lt;/div&gt;

&lt;script&gt;
    const unitData = __UNIT_DATA_JSON__;
    const dict = unitData.dict || {};
    const slidesData = unitData.slidesData || [];

    const PRONUNCIATION_VIDEOS = {
        'iː': { file: 'iː.mp4', sideFile: 'iː-side.mp4' },
        'ɪ': { file: 'ɪ.mp4', sideFile: 'ɪ-side.mp4' },
        'uː': { file: 'uː.mp4', sideFile: 'uː-side.mp4' },
        'ʊ': { file: 'ʊ.mp4', sideFile: 'ʊ-side.mp4' },
        'ɑː': { file: 'ɑ.mp4', sideFile: 'ɑ-side.mp4', note: 'Clip gần tương ứng giọng Mỹ (/ɑ/).' },
        'ʌ': { file: 'ʌ.mp4', sideFile: 'ʌ-side.mp4' },
        'ɔː': { file: 'ɔ.mp4', note: 'Clip gần tương ứng giọng Mỹ (/ɔ/).' },
        'e': { file: 'ɛ.mp4', sideFile: 'ɛ-side.mp4', note: 'Clip gần tương ứng giọng Mỹ (/ɛ/).' },
        'æ': { file: 'æ.mp4', sideFile: 'æ-side.mp4' },
        'ɜː': { file: 'ɝ.mp4', sideFile: 'ɝ-side.mp4', note: 'Clip gần tương ứng giọng Mỹ có âm /r/ (/ɝ/).' },
        'ɪə': { file: 'ɪr.mp4', sideFile: 'ɪr-side.mp4', note: 'Clip gần tương ứng giọng Mỹ có âm /r/ (/ɪr/).' },
        'eɪ': { file: 'eɪ.mp4', sideFile: 'eɪ-side.mp4' },
        'aɪ': { file: 'aɪ.mp4', sideFile: 'aɪ-side.mp4' },
        'ɔɪ': { file: 'ɔɪ.mp4', sideFile: 'ɔɪ-side.mp4' },
        'əʊ': { file: 'oʊ.mp4', sideFile: 'oʊ-side.mp4', note: 'Clip gần tương ứng giọng Mỹ (/oʊ/).' },
        'aʊ': { file: 'aʊ.mp4', sideFile: 'aʊ-side.mp4' },
        'p': { file: 'p.mp4', sideFile: 'p-side.mp4' },
        'b': { file: 'b.mp4', sideFile: 'b-side.mp4' },
        't': { file: 't.mp4', sideFile: 't-side.mp4' },
        'd': { file: 'd.mp4', sideFile: 'd-side.mp4' },
        'k': { file: 'k.mp4', sideFile: 'k-side.mp4' },
        'g': { file: 'g.mp4', sideFile: 'g-side.mp4' },
        'ɡ': { file: 'g.mp4', sideFile: 'g-side.mp4' },
        'f': { file: 'f.mp4', sideFile: 'f-side.mp4' },
        'v': { file: 'v.mp4', sideFile: 'v-side.mp4' },
        's': { file: 's.mp4', sideFile: 's-side.mp4' },
        'z': { file: 'z.mp4', sideFile: 'z-side.mp4' },
        'θ': { file: 'θ.mp4', sideFile: 'θ-side.mp4' },
        'ð': { file: 'ð.mp4', sideFile: 'ð-side.mp4' },
        'ʃ': { file: 'ʃ.mp4', sideFile: 'ʃ-side.mp4' },
        'ʒ': { file: 'ʒ.mp4', sideFile: 'ʒ-side.mp4' },
        'tʃ': { file: 'tʃ.mp4', sideFile: 'tʃ-side.mp4' },
        'dʒ': { file: 'dʒ.mp4', sideFile: 'dʒ-side.mp4' },
        'm': { file: 'm.mp4', sideFile: 'm-side.mp4' },
        'n': { file: 'n.mp4', sideFile: 'n-side.mp4' },
        'ŋ': { file: 'ŋ.mp4', sideFile: 'ŋ-side.mp4' },
        'h': { file: 'h.mp4', sideFile: 'h-side.mp4' },
        'l': { file: 'l.mp4', sideFile: 'l-side.mp4' },
        'r': { file: 'r.mp4', sideFile: 'r-side.mp4' },
        'ɹ': { file: 'ɹ.mp4', sideFile: 'r-side.mp4', note: 'Clip tương ứng phát âm /r/ kiểu Mỹ (/ɹ/).' },
        'w': { file: 'w.mp4', sideFile: 'w-side.mp4' },
        'j': { file: 'j.mp4', sideFile: 'j-side.mp4' },
        'kw': { file: 'kw.mp4', sideFile: 'kw-side.mp4' },
        'sp': { file: 'sp.mp4', sideFile: 'sp-side.mp4' },
        'ɑr': { file: 'ɑr.mp4', sideFile: 'ɑr-side.mp4' },
        'ɔr': { file: 'ɔr.mp4', sideFile: 'ɔr-side.mp4' },
        'θr': { file: 'θr.mp4', sideFile: 'θr-side.mp4' }
    };

    function normalizePronunciationIPA(ipa) {
        return String(ipa || '').trim().replace(/:/g, 'ː');
    }

    function getSlidePronunciationSounds(data) {
        const titles = [data.title];
        if (data.isSummary) {
            if (data.sum1 &amp;&amp; data.sum1.title) titles.push(data.sum1.title);
            if (data.sum2 &amp;&amp; data.sum2.title) titles.push(data.sum2.title);
        }
        const sounds = [];
        titles.forEach(title =&gt; {
            const plainTitle = String(title || '').replace(/&lt;[^&gt;]*&gt;/g, ' ');
            for (const match of plainTitle.matchAll(/\/([^/\s]+)\//g)) {
                const ipa = normalizePronunciationIPA(match[1]);
                if (ipa &amp;&amp; !sounds.includes(ipa)) sounds.push(ipa);
            }
        });
        return sounds;
    }

    function buildPronunciationVideoUI(data) {
        const sounds = getSlidePronunciationSounds(data);
        if (!sounds.length) return '';
        const buttons = sounds.map(ipa =&gt; {
            if (!PRONUNCIATION_VIDEOS[ipa]) return `&lt;span class="pronunciation-video-unavailable"&gt;/${ipa}/ — chưa có video&lt;/span&gt;`;
            return `&lt;button type="button" class="pronunciation-video-button" data-pronunciation-ipa="${ipa}" title="Xem video phát âm /${ipa}/"&gt;▶ /${ipa}/&lt;/button&gt;`;
        }).join('');
        return `&lt;section class="pronunciation-video-tools"&gt;
            &lt;div class="pronunciation-video-label"&gt;Video khẩu hình của âm trong bài (Chính diện &amp; Góc nghiêng)&lt;/div&gt;
            &lt;div class="pronunciation-video-buttons"&gt;${buttons}&lt;/div&gt;
            &lt;div class="pronunciation-video-panel" hidden&gt;
                &lt;div class="pronunciation-video-heading"&gt;
                    &lt;span class="pronunciation-video-caption"&gt;&lt;/span&gt;
                    &lt;button type="button" class="pronunciation-video-close" aria-label="Đóng video"&gt;×&lt;/button&gt;
                &lt;/div&gt;
                &lt;div class="pronunciation-video-grid"&gt;
                    &lt;div class="pronunciation-video-box front-box"&gt;
                        &lt;div class="pronunciation-video-tag pronunciation-video-tag-front"&gt;👀 Góc chính diện (Front)&lt;/div&gt;
                        &lt;video class="pronunciation-video-player front" controls playsinline preload="metadata"&gt;&lt;/video&gt;
                    &lt;/div&gt;
                    &lt;div class="pronunciation-video-box side-box"&gt;
                        &lt;div class="pronunciation-video-tag pronunciation-video-tag-side"&gt;📐 Góc nghiêng (Side)&lt;/div&gt;
                        &lt;video class="pronunciation-video-player side" controls playsinline preload="metadata"&gt;&lt;/video&gt;
                    &lt;/div&gt;
                &lt;/div&gt;
            &lt;/div&gt;
        &lt;/section&gt;`;
    }

    function openPronunciationVideo(slideDiv, ipa) {
        const info = PRONUNCIATION_VIDEOS[ipa];
        if (!info) return;
        const panel = slideDiv.querySelector('.pronunciation-video-panel');
        const frontVideo = panel.querySelector('.pronunciation-video-player.front');
        const sideVideo = panel.querySelector('.pronunciation-video-player.side');
        const sideBox = panel.querySelector('.pronunciation-video-box.side-box');
        const grid = panel.querySelector('.pronunciation-video-grid');
        const caption = panel.querySelector('.pronunciation-video-caption');

        caption.textContent = `Video phát âm /${ipa}/` + (info.sideFile ? ' (Chính diện & Góc nghiêng)' : '');
        if (info.note) {
            const note = document.createElement('span');
            note.className = 'pronunciation-video-note';
            note.textContent = info.note;
            caption.appendChild(note);
        }

        frontVideo.src = new URL(`41_am_don_MP4/${encodeURIComponent(info.file)}`, document.baseURI).href;
        frontVideo.load();

        if (info.sideFile) {
            sideVideo.src = new URL(`41_am_don_MP4/${encodeURIComponent(info.sideFile)}`, document.baseURI).href;
            sideVideo.muted = true;
            sideVideo.load();
            sideBox.style.display = 'flex';
            grid.classList.remove('single-view');
        } else {
            sideVideo.pause();
            sideVideo.removeAttribute('src');
            sideVideo.load();
            sideBox.style.display = 'none';
            grid.classList.add('single-view');
        }

        panel.hidden = false;
        frontVideo.play().catch(() =&gt; {});
        if (info.sideFile) {
            sideVideo.play().catch(() =&gt; {});
        }
    }


    let currentSlide = 0;
    const stage = document.getElementById("stage");
    const dotsContainer = document.getElementById("dots-container");

    function initSlides() {
        stage.innerHTML = '';
        dotsContainer.innerHTML = '';
        currentSlide = 0;

        slidesData.forEach((data, index) =&gt; {
            const slideDiv = document.createElement("div");
            slideDiv.className = `slide ${index === 0 ? 'active' : ''}`;
            slideDiv.id = `slide-${index}`;
            
            let contentHTML = `&lt;h2 class="slide-title"&gt;${data.title}&lt;/h2&gt;`;
            contentHTML += `&lt;div class="slide-subtitle"&gt;${data.subtitle}&lt;/div&gt;`;
            contentHTML += buildPronunciationVideoUI(data);

            if (data.isSummary) {
                const s1 = data.sum1 || { title: unitData.col1_ipa, patterns: [], tips: [] };
                const s2 = data.sum2 || { title: unitData.col2_ipa, patterns: [], tips: [] };
                contentHTML += `
                    &lt;div class="summary-container"&gt;
                        &lt;div class="summary-box sum-long"&gt;
                            &lt;div class="sum-title"&gt;${s1.title}&lt;/div&gt;
                            &lt;div class="sum-patterns"&gt;
                                ${s1.patterns.map(p =&gt; `&lt;div class="pattern-tag"&gt;${p}&lt;/div&gt;`).join('')}
                            &lt;/div&gt;
                            &lt;div class="sum-tip"&gt;
                                &lt;b&gt;💡 Mẹo phát âm:&lt;/b&gt;
                                &lt;ul&gt;
                                    ${s1.tips.map(t =&gt; `&lt;li&gt;${t}&lt;/li&gt;`).join('')}
                                &lt;/ul&gt;
                            &lt;/div&gt;
                        &lt;/div&gt;
                        &lt;div class="summary-box sum-short"&gt;
                            &lt;div class="sum-title"&gt;${s2.title}&lt;/div&gt;
                            &lt;div class="sum-patterns"&gt;
                                ${s2.patterns.map(p =&gt; `&lt;div class="pattern-tag"&gt;${p}&lt;/div&gt;`).join('')}
                            &lt;/div&gt;
                            &lt;div class="sum-tip"&gt;
                                &lt;b&gt;💡 Mẹo phát âm:&lt;/b&gt;
                                &lt;ul&gt;
                                    ${s2.tips.map(t =&gt; `&lt;li&gt;${t}&lt;/li&gt;`).join('')}
                                &lt;/ul&gt;
                            &lt;/div&gt;
                        &lt;/div&gt;
                    &lt;/div&gt;
                    &lt;div class="congrats"&gt;Chúc mừng bạn đã hoàn thành bài học! 🏆&lt;/div&gt;
                `;
            } else if (data.isPairs) {
                contentHTML += `&lt;div class="pair-grid"&gt;`;
                data.pairs.forEach(p =&gt; {
                    const d1 = dict[p.w1] || { ipa: '' };
                    const d2 = dict[p.w2] || { ipa: '' };
                    contentHTML += `
                        &lt;div class="pair-card"&gt;
                            &lt;div class="pair-item" onclick="handleLeftClick(event, '${p.w1}')" oncontextmenu="handleRightClick(event, '${p.w1}')"&gt;
                                &lt;div class="emoji"&gt;${p.i1 || '📝'}&lt;/div&gt;
                                &lt;div style="font-size:1.4rem; font-weight:bold; color:var(--red-ul)"&gt;${p.w1}&lt;/div&gt;
                                &lt;div style="color:#64748b"&gt;${d1.ipa}&lt;/div&gt;
                            &lt;/div&gt;
                            &lt;div class="p-arrow"&gt;→&lt;/div&gt;
                            &lt;div class="pair-item" onclick="handleLeftClick(event, '${p.w2}')" oncontextmenu="handleRightClick(event, '${p.w2}')"&gt;
                                &lt;div class="emoji"&gt;${p.i2 || '📝'}&lt;/div&gt;
                                &lt;div style="font-size:1.4rem; font-weight:bold; color:var(--blue-ul)"&gt;${p.w2}&lt;/div&gt;
                                &lt;div style="color:#64748b"&gt;${d2.ipa}&lt;/div&gt;
                            &lt;/div&gt;
                        &lt;/div&gt;
                    `;
                });
                contentHTML += `&lt;/div&gt;`;
            } else {
                contentHTML += `&lt;div class="word-grid"&gt;`;
                data.words.forEach(w =&gt; {
                    const d = dict[w.w] || { ipa: '' };
                    contentHTML += `
                        &lt;div class="word-card ${data.bgClass}" onclick="handleLeftClick(event, '${w.w}')" oncontextmenu="handleRightClick(event, '${w.w}')"&gt;
                            &lt;div class="emoji"&gt;${w.icon || '📝'}&lt;/div&gt;
                            &lt;div class="word-text-box"&gt;
                                &lt;span class="word-text"&gt;${w.html}&lt;/span&gt;
                                &lt;span class="word-ipa"&gt;${d.ipa}&lt;/span&gt;
                            &lt;/div&gt;
                        &lt;/div&gt;
                    `;
                });
                contentHTML += `&lt;/div&gt;`;
            }

            slideDiv.innerHTML = contentHTML;
            slideDiv.querySelectorAll('.pronunciation-video-button').forEach(button =&gt; {
                button.addEventListener('click', () =&gt; openPronunciationVideo(slideDiv, button.dataset.pronunciationIpa));
            });
            const videoPanel = slideDiv.querySelector('.pronunciation-video-panel');
            if (videoPanel) {
                const frontVideo = videoPanel.querySelector('.pronunciation-video-player.front');
                const sideVideo = videoPanel.querySelector('.pronunciation-video-player.side');

                videoPanel.querySelector('.pronunciation-video-close').addEventListener('click', () =&gt; {
                    if (frontVideo) {
                        frontVideo.pause();
                        frontVideo.removeAttribute('src');
                        frontVideo.load();
                    }
                    if (sideVideo) {
                        sideVideo.pause();
                        sideVideo.removeAttribute('src');
                        sideVideo.load();
                    }
                    videoPanel.hidden = true;
                });

                if (frontVideo &amp;&amp; sideVideo) {
                    frontVideo.addEventListener('play', () =&gt; {
                        if (sideVideo.src &amp;&amp; sideVideo.paused) {
                            sideVideo.currentTime = frontVideo.currentTime;
                            sideVideo.play().catch(() =&gt; {});
                        }
                    });
                    frontVideo.addEventListener('pause', () =&gt; {
                        if (sideVideo.src &amp;&amp; !sideVideo.paused) {
                            sideVideo.pause();
                        }
                    });
                    frontVideo.addEventListener('seeked', () =&gt; {
                        if (sideVideo.src) {
                            sideVideo.currentTime = frontVideo.currentTime;
                        }
                    });
                    frontVideo.addEventListener('ended', () =&gt; {
                        if (sideVideo.src &amp;&amp; !sideVideo.paused) {
                            sideVideo.pause();
                        }
                    });
                    sideVideo.addEventListener('play', () =&gt; {
                        if (frontVideo.src &amp;&amp; frontVideo.paused) {
                            frontVideo.currentTime = sideVideo.currentTime;
                            frontVideo.play().catch(() =&gt; {});
                        }
                    });
                    sideVideo.addEventListener('pause', () =&gt; {
                        if (frontVideo.src &amp;&amp; !frontVideo.paused) {
                            frontVideo.pause();
                        }
                    });
                }
            }
            stage.appendChild(slideDiv);

            const dot = document.createElement("div");
            dot.className = `dot ${index === 0 ? 'active' : ''}`;
            dotsContainer.appendChild(dot);
        });
        updateControls();
    }

    function nextSlide() {
        if (currentSlide &lt; slidesData.length - 1) {
            document.getElementById(`slide-${currentSlide}`).classList.remove("active");
            document.querySelectorAll(".dot")[currentSlide].classList.remove("active");
            currentSlide++;
            document.getElementById(`slide-${currentSlide}`).classList.add("active");
            document.querySelectorAll(".dot")[currentSlide].classList.add("active");
            updateControls();
        }
    }

    function prevSlide() {
        if (currentSlide &gt; 0) {
            document.getElementById(`slide-${currentSlide}`).classList.remove("active");
            document.querySelectorAll(".dot")[currentSlide].classList.remove("active");
            currentSlide--;
            document.getElementById(`slide-${currentSlide}`).classList.add("active");
            document.querySelectorAll(".dot")[currentSlide].classList.add("active");
            updateControls();
        }
    }

    function updateControls() {
        document.getElementById("btn-prev").style.visibility = currentSlide === 0 ? "hidden" : "visible";
        document.getElementById("btn-next").style.visibility = currentSlide === slidesData.length - 1 ? "hidden" : "visible";
    }

    const synth = window.speechSynthesis;
    
    function playAudio(word) {
        if (!synth) return;
        synth.cancel();
        const u = new SpeechSynthesisUtterance(word);
        u.lang = 'en-US';
        u.rate = 0.85;
        synth.speak(u);
    }

    const tooltip = document.getElementById("tooltip");

    function handleLeftClick(event, word) {
        playAudio(word);
        const d = dict[word] || { vi: word };
        tooltip.innerHTML = `🇻🇳 &lt;b&gt;Dịch:&lt;/b&gt; ${d.vi}`;
        tooltip.style.display = "block";
        let x = event.clientX + 15;
        let y = event.clientY + 15;
        if(x + 150 &gt; window.innerWidth) x -= 150;
        if(y + 50 &gt; window.innerHeight) y -= 50;
        tooltip.style.left = x + "px";
        tooltip.style.top = y + "px";
        setTimeout(() =&gt; { tooltip.style.display = "none"; }, 2000);
    }

    function handleRightClick(event, word) {
        event.preventDefault();
        const d = dict[word] || { ipa: '', pos: 'Từ vựng', vi: word };
        document.getElementById("d-word").innerText = word;
        document.getElementById("d-ipa").innerText = d.ipa;
        document.getElementById("d-pos").innerText = d.pos;
        document.getElementById("d-vi").innerText = d.vi;
        document.getElementById("dict-popup").style.display = "flex";
        playAudio(word);
    }

    function closeDict(e) {
        if(!e || e.target.id === 'dict-popup' || !e.target) {
            document.getElementById("dict-popup").style.display = "none";
        }
    }

    function shuffleArray(array) {
        let arr = [...array];
        for (let i = arr.length - 1; i &gt; 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; }
        return arr;

    function chunkArray(array, size) {
        const result = [];

        return result;

    function formatTime(seconds) {

        }, 1000);

    function stopTimer() { clearInterval(timerInterval); isGameStarted = false; }
    function resetStats() {

        globalCorrect = 0; globalWrong = 0; timeElapsed = 0;
        document.getElementById('timer-display').innerText = "00:00";
        document.getElementById('score-correct').innerText = "0";
        document.getElementById('score-wrong').innerText = "0";

    function startNewGame() {
        resetStats();
        let shuffled = shuffleArray(allWordData);
        levels = chunkArray(shuffled, WORDS_PER_LEVEL);
        if (levels.length === 0) levels = [[]];
        currentLevelIndex = 0;
        loadLevel();

    function loadLevel() {
        currentLevelData = levels[currentLevelIndex] || [];

        document.getElementById('btn-next').style.display = 'none';
        document.getElementById('btn-reset').style.display = 'none';

        const pool = document.getElementById('word-pool');
        const col1Container = document.getElementById('col1');
        const col2Container = document.getElementById('col2');

        let col1Count = 0; let col2Count = 0;

            if(word.col === 'col2') col2Count++;
        });
        for(let i=0; i &lt; col1Count; i++) { col1Container.innerHTML += `&lt;div class="slot" data-col="col1" data-filled="false" onclick="handleSlotClick(this)"&gt;?&lt;/div&gt;`; }
        for(let i=0; i &lt; col2Count; i++) { col2Container.innerHTML += `&lt;div class="slot" data-col="col2" data-filled="false" onclick="handleSlotClick(this)"&gt;?&lt;/div&gt;`; }
    }
    function loadNextLevel() { currentLevelIndex++; loadLevel(); }

        window.speechSynthesis.cancel();

    function handleWordClick(id, text, meaning) {
        startTimer(); playAudio(text);
        selectedWordId = id;
        document.querySelectorAll('.word-btn').forEach(btn =&gt; btn.classList.remove('selected'));
        document.getElementById(id).classList.add('selected');
        const toast = document.getElementById('toast-popup');

        toast.classList.add('show');

        toastTimer = setTimeout(() =&gt; { toast.classList.remove('show'); }, 2500);
    }
    function handleSlotClick(slotElement) {
        if (!selectedWordId || slotElement.dataset.filled === 'true') return;
        const wordObj = currentLevelData.find(w =&gt; w.id === selectedWordId);
        const targetCol = slotElement.dataset.col;
        if (wordObj &amp;&amp; wordObj.col === targetCol) {
            globalCorrect++; document.getElementById('score-correct').innerText = globalCorrect;
            slotElement.innerText = wordObj.text; 
            slotElement.dataset.filled = 'true'; slotElement.classList.add('filled');
            const btn = document.getElementById(selectedWordId);

            selectedWordId = null; placedCount++;

            slotElement.classList.add('shake');
            setTimeout(() =&gt; { slotElement.classList.remove('shake'); }, 400);
        }
    }
    function checkWin() {
        if (placedCount === currentLevelData.length) {

            } else {

                document.getElementById('success-msg').style.display = 'block';
                document.getElementById('btn-reset').style.display = 'inline-block';

    }

        function getRandomItems(arr, count) {
            let shuffled = arr.slice(0).sort(() =&gt; 0.5 - Math.random());
            return shuffled.slice(0, Math.min(count, shuffled.length));
        }
        function closeAllPopups() { document.querySelectorAll('.dict-popup').forEach(p =&gt; p.remove()); }
        function handleWordClick(element, word) {
            closeAllPopups();
            if ('speechSynthesis' in window) {
                let utterance = new SpeechSynthesisUtterance(word);
                utterance.lang = 'en-US'; window.speechSynthesis.speak(utterance);
            }
            let cleanWord = word.toLowerCase();
            let dictData = wordDictionary[cleanWord] || { phonetic: "", type: "", meaning: "Đang cập nhật..." };
            let popup = document.createElement('div');
            popup.className = 'dict-popup';
            popup.innerHTML = `&lt;span class="dict-word"&gt;${word}&lt;/span&gt;${dictData.phonetic ? `&lt;span class="dict-phonetic"&gt;${dictData.phonetic}&lt;/span&gt;` : ''}&lt;span class="dict-meaning"&gt;&lt;span class="dict-type"&gt;${dictData.type}&lt;/span&gt;${dictData.meaning}&lt;/span&gt;`;

        document.addEventListener('click', function(e) { if (!e.target.closest('.clickable-word')) { closeAllPopups(); } });
        function parseSentence(text, sentenceIndex) {
            let parts = text.split(/\[(.*?)\]/);
            let html = '';
            for(let i = 0; i &lt; parts.length; i++) {
                if (i % 2 === 0) {
                    let words = parts[i].split(/([\w']+)/g);
                    for (let w of words) {
                        if (/[\w']+/.test(w)) { html += `&lt;span class="clickable-word" onclick="handleWordClick(this, '${w.replace(/'/g, "\\'")}')"&gt;${w}&lt;/span&gt;`; } 
                        else { html += w; }
                    }
                } else {
                    let word = parts[i];
                    html += `&lt;input type="text" class="input-box blank-input" data-word="${word}" autocomplete="off"&gt;`;
                }
            }
            return html;
        }
        function playHybridAudio(audioId, rawText) {
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            let cleanTextForTTS = rawText.replace(/\[(.*?)\]/g, "$1");

                utterance.lang = 'en-US'; utterance.rate = 0.85; window.speechSynthesis.speak(utterance);

        }

            document.getElementById('btn-show').style.display = 'inline-block';

            currentRound.forEach((item, index) =&gt; {

                totalBlanksThisRound += blanksInSentence;
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `

                    &lt;div class="sentence"&gt;${parseSentence(item.text, index)}&lt;/div&gt;

                board.appendChild(card);

            document.getElementById('btn-check').style.display = 'none'; document.getElementById('btn-show').style.display = 'none'; document.getElementById('btn-next').style.display = 'inline-block';

&lt;script&gt;
    const unitData = __UNIT_DATA_JSON__;
    const wordsA = (unitData.wordsA &amp;&amp; unitData.wordsA.length &gt; 0) ? unitData.wordsA : ["cat", "car"];
    const wordsU = (unitData.wordsB &amp;&amp; unitData.wordsB.length &gt; 0) ? unitData.wordsB : ["cut", "cup"];
    const pairs = (unitData.pairs &amp;&amp; unitData.pairs.length &gt; 0) ? unitData.pairs : [{ a: wordsA[0], u: wordsU[0] }];
    const synth = window.speechSynthesis;
    const app = {
        globalScore: 0, currentMode: '', questionIndex: 0, totalQuestions: 15, currentRoundScore: 0, currentQuestionData: null,
        init() { this.showMenu(); },
        getRandom(arr, count = 1) { const shuffled = [...arr].sort(() =&gt; 0.5 - Math.random()); return count === 1 ? shuffled[0] : shuffled.slice(0, count); },
        playSound(word) { synth.cancel(); const u = new SpeechSynthesisUtterance(word); u.lang = 'en-US'; u.rate = 0.85; synth.speak(u); },
        switchScreen(screenId) { document.querySelectorAll('.screen').forEach(s =&gt; s.classList.remove('active')); document.getElementById(screenId).classList.add('active'); },
        showMenu() { this.switchScreen('screen-menu'); },
        updateProgress(id) { const percent = (this.questionIndex / this.totalQuestions) * 100; document.getElementById(id).style.width = percent + '%'; },
        showFeedback(overlayId, isCorrect, callback) {
            const el = document.getElementById(overlayId); el.style.display = 'flex'; el.style.backgroundColor = isCorrect ? 'rgba(16, 185, 129, 0.9)' : 'rgba(239, 68, 68, 0.9)'; el.innerHTML = isCorrect ? '✔️' : '❌';
            if(isCorrect) { this.currentRoundScore++; this.globalScore++; document.getElementById('global-score').innerText = this.globalScore; }
            setTimeout(() =&gt; { el.style.display = 'none'; el.style.animation = 'none'; el.offsetHeight; el.style.animation = null; this.questionIndex++; callback(); }, 800);
        },
        endRound() { this.switchScreen('screen-result'); document.getElementById('round-score').innerText = this.currentRoundScore; document.getElementById('btn-replay').onclick = () =&gt; this.startGame(this.currentMode); },
        startGame(mode) {
            this.currentMode = mode; this.questionIndex = 0; this.currentRoundScore = 0;
            if(mode === 'sort') { this.totalQuestions = 15; this.switchScreen('screen-sort'); this.loadSortQuestion(); } 
            else if(mode === 'odd') { this.totalQuestions = 15; this.switchScreen('screen-odd'); this.loadOddQuestion(); } 
            else if(mode === 'listen') { this.totalQuestions = 15; this.switchScreen('screen-listen'); this.loadListenQuestion(); }
        },
        loadSortQuestion() {
            if (this.questionIndex &gt;= this.totalQuestions) return this.endRound();
            this.updateProgress('sort-progress');
            const isA = Math.random() &gt; 0.5; const word = isA ? this.getRandom(wordsA) : this.getRandom(wordsU);
            this.currentQuestionData = { word, type: isA ? 'a' : 'u' };
            const wordEl = document.getElementById('sort-word'); wordEl.innerText = word; this.playSound(word);
        },
        checkSort(userChoice) { const isCorrect = (userChoice === this.currentQuestionData.type); this.showFeedback('sort-feedback', isCorrect, () =&gt; this.loadSortQuestion()); },
        loadOddQuestion() {
            if (this.questionIndex &gt;= this.totalQuestions) return this.endRound();
            this.updateProgress('odd-progress');
            const majorityA = Math.random() &gt; 0.5; let options = []; let answer = '';
            if(majorityA) { options = this.getRandom(wordsA, Math.min(3, wordsA.length)); answer = this.getRandom(wordsU); } 
            else { options = this.getRandom(wordsU, Math.min(3, wordsU.length)); answer = this.getRandom(wordsA); }
            options.push(answer); options.sort(() =&gt; 0.5 - Math.random()); this.currentQuestionData = { answer };
            const grid = document.getElementById('odd-grid'); grid.innerHTML = '';
            options.forEach(opt =&gt; {
                const btn = document.createElement('div'); btn.className = 'odd-option'; btn.innerText = opt;
                btn.onclick = () =&gt; { this.playSound(opt); setTimeout(() =&gt; { this.checkOdd(opt); }, 500); };
                grid.appendChild(btn);
            });
        },
        checkOdd(userChoice) { const isCorrect = (userChoice === this.currentQuestionData.answer); this.showFeedback('odd-feedback', isCorrect, () =&gt; this.loadOddQuestion()); },
        loadListenQuestion() {
            if (this.questionIndex &gt;= this.totalQuestions) return this.endRound();
            this.updateProgress('listen-progress');
            const pair = this.getRandom(pairs);
            const isA = Math.random() &gt; 0.5; const targetWord = isA ? pair.a : pair.u; this.currentQuestionData = { word: targetWord };
            const container = document.getElementById('listen-options'); container.innerHTML = '';
            const opts = [pair.a, pair.u].sort(() =&gt; 0.5 - Math.random());
            opts.forEach(opt =&gt; { const btn = document.createElement('div'); btn.className = 'listen-opt'; btn.innerText = opt; btn.onclick = () =&gt; this.checkListen(opt); container.appendChild(btn); });
            this.playCurrentListenAudio();
        },
        playCurrentListenAudio() { if(this.currentQuestionData &amp;&amp; this.currentQuestionData.word) { this.playSound(this.currentQuestionData.word); } },
        checkListen(userChoice) { const isCorrect = (userChoice === this.currentQuestionData.word); this.showFeedback('listen-feedback', isCorrect, () =&gt; this.loadListenQuestion()); }
    };
    window.onload = () =&gt; { app.init(); };
&lt;/script&gt;
&lt;/body&gt;
&lt;/html&gt;
